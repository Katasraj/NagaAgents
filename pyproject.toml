[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nagamurali-kotari", email = "nagamurali_kotari@apple.com" }
]
requires-python = ">=3.10"
dependencies = [
    "black>=26.10.1",
    "google>=3.0.0",
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "isort>=9.0.2",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "ollama>=0.6.3",
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
